<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunday Bulletin · Harlem Temple</title>
<meta name="description" content="This Sunday's order of service, announcements and weekly schedule at The Salvation Army Harlem Temple.">
<meta name="theme-color" content="#13203B">
<link rel="icon" href="../media/logo.png">
<link rel="apple-touch-icon" href="../media/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500;1,9..144,600&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#13203B; --navy2:#1C2D52; --red:#C8202A; --gold:#E8A920; --gold-soft:#F6E3B4;
    --bg:#F7F0E3; --card:#FFFDF8; --ink:#1B1B1F; --muted:#5E5A52; --line:rgba(19,32,59,.10); --chip:rgba(19,32,59,.06);
    --accent:var(--red); --head:var(--navy);
    --serif:"Fraunces", Georgia, "Times New Roman", serif;
    --sans:"Archivo", "Segoe UI", Roboto, Arial, sans-serif;
    --fs:17px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1526; --card:#152039; --ink:#F2EBDD; --muted:#B6AE9F; --line:rgba(255,255,255,.10); --chip:rgba(255,255,255,.07);
      --accent:#FF6B6B; --head:#F6E3B4;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1526; --card:#152039; --ink:#F2EBDD; --muted:#B6AE9F; --line:rgba(255,255,255,.10); --chip:rgba(255,255,255,.07);
    --accent:#FF6B6B; --head:#F6E3B4;
  }
  html.big{--fs:20px}
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:var(--fs);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--sans);min-height:100vh}
  .nw{white-space:nowrap}
  a{color:inherit}

  /* ---------- cover ---------- */
  header{position:relative;overflow:hidden;color:#F7F0E3;background:radial-gradient(120% 90% at 85% 0%, var(--navy2) 0%, var(--navy) 55%, #0A1222 100%);padding:28px 20px 30px;padding-top:calc(28px + env(safe-area-inset-top))}
  header .ring{position:absolute;right:-90px;top:-80px;width:280px;height:280px;border-radius:50%;border:4px solid var(--gold);opacity:.45}
  header .ring::before{content:"";position:absolute;inset:34px;border-radius:50%;border:18px solid var(--red);opacity:.35}
  header .ring::after{content:"";position:absolute;inset:92px;border-radius:50%;background:var(--gold);opacity:.16}
  .wrap{max-width:640px;margin:0 auto;position:relative}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:46px;height:auto;flex:none}
  .brand .t{font:800 .68rem/1.25 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  .brand .t b{display:block;color:#F7F0E3;letter-spacing:.14em}
  .tools{position:absolute;right:0;top:4px;display:flex;gap:8px}
  .tools button{appearance:none;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#F7F0E3;border-radius:99px;font:700 .72rem/1 var(--sans);padding:8px 11px;cursor:pointer}
  h1{margin-top:22px;font:700 2.2rem/1.02 var(--serif);letter-spacing:-.01em}
  h1 em{display:block;font-style:italic;font-weight:500;color:var(--gold-soft);font-size:.62em;margin-top:6px}
  .tithe{display:grid;width:fit-content;grid-template-columns:auto 1fr;align-items:center;column-gap:12px;margin-top:16px;max-width:360px;text-decoration:none;background:var(--gold);color:var(--navy);border-radius:16px;padding:13px 18px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
  .tithe[hidden]{display:none}
  .tithe svg{grid-row:1 / span 2;width:26px;height:26px}
  .tithe span{font:800 1.02rem/1.1 var(--sans)}
  .tithe small{font:600 .76rem/1.2 var(--sans);opacity:.8}
  .date{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:var(--red);color:#fff;border-radius:99px;padding:8px 14px;font:700 .82rem/1 var(--sans);letter-spacing:.04em}
  .date svg{width:15px;height:15px}

  /* message card overlapping the cover */
  .message{position:relative;margin:-2px auto 0;max-width:640px;padding:0 16px}
  .mcard{position:relative;top:-14px;background:var(--card);border-radius:20px;padding:20px 20px 18px;box-shadow:0 14px 34px rgba(19,32,59,.16);border:1px solid var(--line);overflow:hidden}
  .mcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--gold),var(--red))}
  .kick{font:800 .66rem/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
  .mcard .ttl{margin-top:10px;font:600 italic 1.9rem/1.05 var(--serif);color:var(--head)}
  .mcard .by{margin-top:10px;font-weight:600}
  .mcard .ref{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:var(--chip);border-radius:10px;padding:8px 11px;font:600 .88rem/1.2 var(--sans)}
  .mcard .ref svg{width:16px;height:16px;color:var(--accent);flex:none}

  /* ---------- nav ---------- */
  nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
  nav .wrap::-webkit-scrollbar{display:none}
  nav a{flex:none;text-decoration:none;font:700 .8rem/1 var(--sans);padding:10px 14px;border-radius:99px;background:var(--chip);color:var(--ink)}
  nav a.on{background:var(--navy);color:#F7F0E3}
  :root[data-theme="dark"] nav a.on{background:var(--gold);color:var(--navy)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) nav a.on{background:var(--gold);color:var(--navy)} }

  main{max-width:640px;margin:0 auto;padding:6px 16px 40px}
  section{padding-top:26px;scroll-margin-top:62px}
  h2{display:flex;align-items:center;gap:10px;font:700 1.45rem/1.1 var(--serif);color:var(--head);margin-bottom:14px}
  h2::before{content:"";width:26px;height:4px;border-radius:9px;background:var(--gold);flex:none}

  /* ---------- order of service ---------- */
  .oos{list-style:none;position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 0}
  .oos li{position:relative;display:grid;grid-template-columns:22px 1fr;gap:0 12px;padding:13px 18px 13px 14px}
  .oos li + li{border-top:1px dashed var(--line)}
  .dot{grid-row:1 / span 3;margin-top:6px;width:12px;height:12px;border-radius:50%;border:3px solid var(--gold);background:var(--card);justify-self:center}
  .oos .it{font:700 1.06rem/1.25 var(--serif)}
  .oos .who{color:var(--muted);font-weight:500;font-size:.92rem;margin-top:3px}
  .oos .song{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:6px}
  .num{font:800 .74rem/1 var(--sans);letter-spacing:.04em;background:var(--navy);color:#F7F0E3;border-radius:7px;padding:5px 7px}
  :root[data-theme="dark"] .num{background:var(--gold);color:var(--navy)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .num{background:var(--gold);color:var(--navy)} }
  .song i{font:500 italic 1rem/1.3 var(--serif)}
  .stand{display:inline-block;margin-left:6px;vertical-align:2px;background:var(--red);color:#fff;font:800 .62rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;border-radius:6px;padding:5px 7px}
  .oos li.msg{background:linear-gradient(90deg, color-mix(in srgb, var(--gold) 16%, transparent), transparent 85%)}
  .oos li.msg .dot{background:var(--red);border-color:var(--red)}
  .oos li.msg .song i{font-size:1.15rem;font-weight:600}
  .scr{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font:600 .9rem/1.2 var(--sans);color:var(--accent)}
  .scr svg{width:15px;height:15px}

  /* ---------- announcements ---------- */
  .events{list-style:none;display:grid;gap:10px}
  .events li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:500}
  .events li::before{content:"";flex:none;width:9px;height:9px;margin-top:8px;border-radius:2px;background:var(--red);transform:rotate(45deg)}
  .note{margin-top:12px;background:var(--navy);color:#F7F0E3;border-radius:16px;padding:16px 18px}
  .note .kick{color:var(--gold)}
  .note p{margin-top:8px;line-height:1.55}
  .flyers{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .flyers::-webkit-scrollbar{display:none}
  .flyers button{flex:none;width:62%;max-width:250px;scroll-snap-align:start;border:0;padding:0;background:none;cursor:zoom-in;border-radius:12px;overflow:hidden;box-shadow:0 8px 20px rgba(19,32,59,.18)}
  .flyers img{display:block;width:100%;height:auto}
  .hint{font-size:.78rem;color:var(--muted);margin-top:4px}

  /* ---------- this week ---------- */
  .day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
  .day h3{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;font:800 .78rem/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  .day h3 small{font:600 .76rem/1 var(--sans);letter-spacing:.02em;text-transform:none;color:var(--muted)}
  .day ul{list-style:none;margin-top:8px}
  .day li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
  .day li:first-child{border-top:0}
  .day .n{font-weight:600}
  .day .n small{display:block;font-weight:500;color:var(--muted);font-size:.82rem}
  .day .tm{flex:none;max-width:48%;text-align:right;color:var(--muted);font-weight:600;font-size:.9rem}
  .day .tm.tba{font-style:italic;font-weight:500}

  /* ---------- footer ---------- */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions a{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:14px;padding:14px 10px;font:800 .88rem/1 var(--sans)}
  .actions a svg{width:18px;height:18px}
  .a-live{background:var(--red);color:#fff}
  .a-give{background:var(--gold);color:var(--navy)}
  .a-call{grid-column:1 / -1;background:var(--chip);color:var(--ink)}
  footer{margin-top:14px;background:var(--navy);color:#F7F0E3;border-radius:18px;padding:18px;text-align:center}
  footer .kick{color:var(--gold)}
  footer p{margin-top:6px;font:500 .95rem/1.5 var(--sans)}
  footer .pastors{margin-top:8px}
  footer .pastors p{margin-top:2px;font-family:var(--serif);font-weight:600}
  footer .addr{margin-top:14px}
  .stamp{text-align:center;color:var(--muted);font-size:.74rem;margin-top:14px}

  .empty{padding:40px 0;text-align:center;color:var(--muted)}

  /* lightbox */
  #lb{position:fixed;inset:0;z-index:20;background:rgba(6,10,20,.92);display:none;align-items:center;justify-content:center;padding:16px}
  #lb.on{display:flex}
  #lb img{max-width:100%;max-height:100%;border-radius:8px}
  #lb button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;border:0;background:rgba(255,255,255,.15);color:#fff;width:42px;height:42px;border-radius:50%;font:700 1.2rem/1 var(--sans)}
</style>
</head>
<body>
<header>
  <div class="ring"></div>
  <div class="wrap">
    <div class="brand"><img src="../media/logo.png" alt="The Salvation Army shield"><div class="t">The Salvation Army<b>Harlem Temple Corps</b></div></div>
    <div class="tools"><button id="bigBtn" aria-label="Larger text">A+</button></div>
    <h1 id="cname">Harlem Temple<em>Worship Center</em></h1>
    <div class="date" id="date" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span></span></div>
    <a class="tithe" id="tithe" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg><span>Tithes &amp; Offering</span><small>Give with Tithe.ly</small></a>
  </div>
</header>

<div class="message" id="msgWrap" hidden><div class="mcard" id="mcard"></div></div>

<nav><div class="wrap">
  <a href="#service" class="on">Order of Service</a>
  <a href="#announcements">Announcements</a>
  <a href="#week">Weekly Schedule</a>
  <a href="#connect">Connect</a>
</div></nav>

<main id="main"><div class="empty">Loading this Sunday&rsquo;s bulletin&hellip;</div></main>

<div id="lb" role="dialog" aria-label="Flyer"><button aria-label="Close">&times;</button><img alt=""></div>

<script>
(function(){
  const BASE = "https://raw.githubusercontent.com/pierrenfilsaime-netizen/harlemtemple-announcements/data/";
  const Q = new URLSearchParams(location.search);
  const FEED = Q.get("feed") || BASE;               // ?feed=... for local previews
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  // keep the Fils-Aime / Fils-Aimé name on one line
  const txt = s => esc(s).replace(/Fils-Aim(e|é)/g, m => `<span class="nw">${m}</span>`);
  const MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const parseDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const today = ymd(Q.get("at") ? new Date(Q.get("at")) : new Date());
  const ICON = {
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>',
    live: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    give: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
    call: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>'
  };

  /* ---------- text size (remembered on this phone) ---------- */
  const root = document.documentElement;
  try { if (localStorage.getItem("bulletin-big") === "1") root.classList.add("big"); } catch(e){}
  document.getElementById("bigBtn").onclick = () => {
    root.classList.toggle("big");
    try { localStorage.setItem("bulletin-big", root.classList.contains("big") ? "1" : "0"); } catch(e){}
  };

  /* ---------- load (fresh, else the last copy this phone saw) ---------- */
  async function get(name){
    const url = FEED + name;
    try {
      const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const t = await r.text(); JSON.parse(t);
      try { localStorage.setItem("bulletin-" + name, t); } catch(e){}
      return JSON.parse(t);
    } catch(e) {
      try { const t = localStorage.getItem("bulletin-" + name); if (t) return JSON.parse(t); } catch(e2){}
      return null;
    }
  }

  function render(B, C){
    const main = document.getElementById("main");
    if (!B) { main.innerHTML = '<div class="empty">The bulletin couldn&rsquo;t load. Please check your connection and try again.</div>'; return; }

    // cover
    if (B.name && B.name.length) {
      const n = B.name.filter(x => !/^the salvation army$/i.test(x));
      document.getElementById("cname").innerHTML = esc(n[0] || "Harlem Temple") + (n[1] ? `<em>${esc(n.slice(1).join(" "))}</em>` : "");
    }
    if (B.date) {
      const d = parseDate(B.date), el = document.getElementById("date");
      el.querySelector("span").textContent = `${WD[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
      el.hidden = false;
    }

    // Tithes & Offering button (top of the page)
    const tl = (B.links || {}).tithes;
    if (tl) { const a = document.getElementById("tithe"); a.href = tl; a.hidden = false; }

    // message card
    const msg = (B.service || []).find(s => s.message);
    if (msg) {
      document.getElementById("mcard").innerHTML =
        `<div class="kick">${esc(msg.item || "Morning Message")}</div><div class="ttl">“${esc(msg.message)}”</div>` +
        (msg.who ? `<div class="by">${txt(msg.who)}</div>` : "") +
        (() => { const sr = (B.service || []).find(s => s.scripture); return sr ? `<div class="ref">${ICON.book}${esc(sr.scripture)}</div>` : ""; })();
      document.getElementById("msgWrap").hidden = false;
    }

    let h = "";

    // order of service
    h += `<section id="service"><h2>Order of Service</h2><ol class="oos">` + (B.service || []).map(s => {
      const song = (s.number || s.song || s.message) ? `<div class="song">${s.number ? `<span class="num">${esc(s.number)}</span>` : ""}${(s.song || s.message) ? `<i>“${esc(s.song || s.message)}”</i>` : ""}</div>` : "";
      const scr = s.scripture ? `<div class="scr">${ICON.book}${esc(s.scripture)}</div>` : "";
      return `<li class="${s.message ? "msg" : ""}"><span class="dot"></span><div><div class="it">${esc(s.item)}${s.stand ? '<span class="stand">Please Stand</span>' : ""}</div>${song}${scr}${s.who ? `<div class="who">${txt(s.who)}</div>` : ""}</div></li>`;
    }).join("") + `</ol></section>`;

    // announcements
    const flyers = ((C && C.slides) || []).filter(s => (s.type === "flyer" || s.type === "image") && s.media && (!s.start || today >= s.start) && (!s.end || today <= s.end));
    h += `<section id="announcements"><h2>Announcements</h2>`;
    if ((B.events || []).length) h += `<ul class="events">${B.events.map(e => `<li>${txt(e)}</li>`).join("")}</ul>`;
    for (const n of (B.notes || [])) h += `<div class="note"><div class="kick">${esc(n.title)}</div><p>${txt(n.text)}</p></div>`;
    if (flyers.length) h += `<div class="flyers">${flyers.map(f => { const src = /^(https?:|\/)/.test(f.media) ? f.media : FEED + f.media; return `<button data-src="${esc(src)}" aria-label="${esc(f.title || f.kicker || "Flyer")}"><img src="${esc(src)}" alt="${esc(f.title || f.kicker || "Flyer")}" loading="lazy"></button>`; }).join("")}</div><div class="hint">Swipe for more flyers. Tap one to see it full size.</div>`;
    h += `</section>`;

    // weekly schedule
    if ((B.schedule || []).length) {
      h += `<section id="week"><h2>Weekly Schedule</h2>` + B.schedule.map(g =>
        `<div class="day"><h3>${esc(g.heading)}${g.note ? `<small>${esc(g.note)}</small>` : ""}</h3><ul>${(g.items || []).map(i =>
          `<li><span class="n">${esc(i.name)}${i.note ? `<small>${esc(i.note)}</small>` : ""}</span>${i.time ? `<span class="tm${/to be announced/i.test(i.time) ? " tba" : ""}">${esc(i.time)}</span>` : ""}</li>`).join("")}</ul></div>`).join("") + `</section>`;
    }

    // connect
    const L = B.links || {};
    h += `<section id="connect"><h2>Connect</h2><div class="actions">` +
      (L.live ? `<a class="a-live" href="${esc(L.live)}" target="_blank" rel="noopener">${ICON.live}Watch Live</a>` : "") +
      (L.give ? `<a class="a-give" href="${esc(L.give)}" target="_blank" rel="noopener">${ICON.give}Give Online</a>` : "") +
      (L.phone ? `<a class="a-call" href="tel:${esc(L.phone.replace(/[^\d+]/g, ""))}">${ICON.call}${esc(L.phone)}</a>` : "") +
      `</div><footer>` +
      ((B.pastors || []).length ? `<div class="kick">Pastors</div><div class="pastors">${B.pastors.map(p => `<p>${txt(p)}</p>`).join("")}</div>` : "") +
      ((B.address || []).length ? `<div class="addr"><div class="kick">Address</div><p>${B.address.map(esc).join("<br>")}</p></div>` : "") +
      `</footer></section>`;

    main.innerHTML = h;

    // flyer lightbox
    const lb = document.getElementById("lb");
    main.querySelectorAll(".flyers button").forEach(b => b.onclick = () => { lb.querySelector("img").src = b.dataset.src; lb.classList.add("on"); });
    lb.onclick = () => lb.classList.remove("on");

    // highlight the section in view
    const links = [...document.querySelectorAll("nav a")];
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
    }), { rootMargin: "-40% 0px -55% 0px" });
    main.querySelectorAll("section").forEach(s => io.observe(s));
  }

  Promise.all([get("bulletin.json"), get("content.json")]).then(([B, C]) => render(B, C));
})();
</script>
</body>
</html>
