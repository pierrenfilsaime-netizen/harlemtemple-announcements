<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harlem Temple Announcements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#13203B; --navy2:#1C2D52; --red:#D3242C; --red-deep:#9E1A20;
    --gold:#F2B634; --cream:#F7F0E3; --cream2:#EFE3CC; --ink:#1B1B1F;
    /* one unit = 1% of a 16:9 frame, so the layout scales on any screen */
    --u: min(1vw, 1.7778vh);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Archivo", "Segoe UI", Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:var(--sans)}
  body.idle{cursor:none}

  /* 16:9 frame, letterboxed on odd screens so the stream overlay is always 1920x1080 in shape */
  #frame{position:absolute;left:50%;top:50%;width:calc(var(--u)*100);height:calc(var(--u)*56.25);transform:translate(-50%,-50%);overflow:hidden;background:var(--navy)}

  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
  .slide.on{opacity:1}

  .pad{position:absolute;inset:0;padding:calc(var(--u)*5.5) calc(var(--u)*7) calc(var(--u)*8);display:flex;flex-direction:column;justify-content:center}
  .kicker{display:inline-flex;align-items:center;gap:calc(var(--u)*1.2);font:800 calc(var(--u)*1.35)/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin-bottom:calc(var(--u)*2)}
  .kicker::before{content:"";width:calc(var(--u)*4);height:calc(var(--u)*.35);background:var(--gold);border-radius:9px}
  .title{font:700 calc(var(--u)*6.4)/1.02 var(--serif);letter-spacing:-.015em;max-width:calc(var(--u)*70);text-wrap:balance}
  .body{font:400 calc(var(--u)*2.2)/1.45 var(--sans);max-width:calc(var(--u)*58);margin-top:calc(var(--u)*2.4);opacity:.9;text-wrap:pretty}

  .t-cream{background:radial-gradient(120% 90% at 85% 10%, #FFF8EA 0%, var(--cream) 45%, var(--cream2) 100%);color:var(--navy)}
  .t-navy{background:radial-gradient(110% 90% at 80% 0%, var(--navy2) 0%, var(--navy) 60%, #0C1528 100%);color:var(--cream)}
  .t-navy .kicker{color:var(--gold)}
  .t-red{background:radial-gradient(110% 100% at 85% 0%, #E2363D 0%, var(--red) 45%, var(--red-deep) 100%);color:#fff}
  .t-red .kicker{color:#fff}

  .rings{position:absolute;right:calc(var(--u)*-9);top:calc(var(--u)*-6);width:calc(var(--u)*48);height:calc(var(--u)*48);border-radius:50%;border:calc(var(--u)*.5) solid var(--gold);opacity:.55}
  .rings::before{content:"";position:absolute;inset:calc(var(--u)*5);border-radius:50%;border:calc(var(--u)*2.2) solid var(--red);opacity:.16}
  .rings::after{content:"";position:absolute;inset:calc(var(--u)*13);border-radius:50%;background:var(--gold);opacity:.18}
  .t-red .rings::before{border-color:#fff;opacity:.12}
  .t-navy .rings::before{border-color:var(--red);opacity:.45}

  .has-bg{color:#fff}
  .has-bg .kicker{color:var(--gold)}
  .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .bgshade{position:absolute;inset:0;background:linear-gradient(90deg, rgba(12,21,40,.92) 0%, rgba(12,21,40,.72) 45%, rgba(12,21,40,.15) 100%)}

  /* date tile + meta line */
  .ev{display:flex;align-items:center;gap:calc(var(--u)*5)}
  .datetile{flex:none;width:calc(var(--u)*20);border-radius:calc(var(--u)*1.6);overflow:hidden;box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*3) rgba(19,32,59,.22);transform:rotate(-2.5deg)}
  .datetile .m{background:var(--navy);color:var(--gold);font:800 calc(var(--u)*2)/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:calc(var(--u)*1.5) 0}
  .datetile .d{background:var(--red);color:#fff;font:700 calc(var(--u)*10.5)/1 var(--serif);text-align:center;padding:calc(var(--u)*1.6) 0 calc(var(--u)*2.2)}
  .t-navy .datetile .m{background:var(--gold);color:var(--navy)}
  .t-navy .datetile,.has-bg .datetile{box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*3) rgba(0,0,0,.45)}
  .meta{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.2) calc(var(--u)*3.2);margin-top:calc(var(--u)*2.2);font:600 calc(var(--u)*2.1)/1.2 var(--sans)}
  .meta span{display:inline-flex;align-items:center;gap:calc(var(--u)*.9)}
  .meta svg{width:calc(var(--u)*2.3);height:calc(var(--u)*2.3);color:var(--red);flex:none}
  .t-navy .meta svg,.t-red .meta svg,.has-bg .meta svg{color:var(--gold)}

  /* time rows (e.g. Sunday schedule) */
  .rows{list-style:none;margin-top:calc(var(--u)*2.6);display:grid;gap:calc(var(--u)*1.1);max-width:calc(var(--u)*56)}
  .rows li{display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*1.3) calc(var(--u)*1.8);border-radius:calc(var(--u)*1);background:rgba(19,32,59,.06);border:1px solid rgba(19,32,59,.08)}
  .t-navy .rows li,.t-red .rows li,.has-bg .rows li{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
  .rows .w{flex:none;min-width:calc(var(--u)*13);font:800 calc(var(--u)*2.1)/1 var(--sans);color:var(--red)}
  .t-navy .rows .w,.t-red .rows .w,.has-bg .rows .w{color:var(--gold)}
  .rows .x{font:700 calc(var(--u)*2.7)/1.1 var(--serif)}

  /* flyer: blurred backdrop, flyer with optional details beside it */
  .s-flyer{background:#0C1528}
  .s-flyer .blur{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(44px) brightness(.45) saturate(1.2)}
  .s-flyer .fl{position:absolute;top:calc(var(--u)*3.5);bottom:calc(var(--u)*3.5);left:50%;transform:translateX(-50%);max-width:92%;object-fit:contain;height:calc(100% - var(--u)*7);border-radius:calc(var(--u)*.6);box-shadow:0 calc(var(--u)*1.6) calc(var(--u)*5) rgba(0,0,0,.55)}
  .s-flyer.side .fl{left:auto;right:calc(var(--u)*6);transform:none;max-width:44%}
  .s-flyer .fd{position:absolute;left:calc(var(--u)*7);top:0;bottom:calc(var(--u)*6);width:44%;display:flex;flex-direction:column;justify-content:center;color:#fff}
  .s-flyer .fd .kicker{color:var(--gold)}
  .s-flyer .fd .title{font-size:calc(var(--u)*5.6)}
  .s-flyer .fd .meta svg{color:var(--gold)}
  .s-flyer .fd .datetile{transform:rotate(-2.5deg);margin-bottom:calc(var(--u)*3);width:calc(var(--u)*15);box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*3) rgba(0,0,0,.45)}
  .s-flyer .fd .datetile .d{font-size:calc(var(--u)*8)}
  .s-flyer .fd .datetile .m{background:var(--gold);color:var(--navy);font-size:calc(var(--u)*1.6)}

  /* this week */
  .s-week .pad{padding-bottom:calc(var(--u)*5)}
  .s-week .title{font-size:calc(var(--u)*5)}
  .wgrid{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1) calc(var(--u)*2);margin-top:calc(var(--u)*3);max-width:calc(var(--u)*86)}
  .wi{display:flex;align-items:center;gap:calc(var(--u)*1.6);padding:calc(var(--u)*1.1) calc(var(--u)*1.5);border-radius:calc(var(--u)*1);background:rgba(19,32,59,.06);border:1px solid rgba(19,32,59,.08)}
  .wi .dd{flex:none;width:calc(var(--u)*10.5);font:800 calc(var(--u)*1.15)/1.25 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
  .wi .nm{flex:1;min-width:0;font:700 calc(var(--u)*1.95)/1.1 var(--serif)}
  .wi .tm{flex:none;font:600 calc(var(--u)*1.45)/1 var(--sans);opacity:.75;white-space:nowrap}
  .wi.today{background:var(--navy);color:var(--cream);border-color:var(--navy)}
  .wi.today .dd{color:var(--gold)}

  /* birthdays */
  .s-bday{background:radial-gradient(110% 100% at 85% 0%, #E2363D 0%, var(--red) 45%, var(--red-deep) 100%);color:#fff}
  .s-bday .kicker{color:var(--gold)}
  .s-bday .title{font-size:calc(var(--u)*5.8)}
  .s-bday .rings::before{border-color:#fff;opacity:.12}
  .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .confetti i{position:absolute;width:calc(var(--u)*1.1);height:calc(var(--u)*.45);border-radius:2px;opacity:.85;animation:drift 9s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translateY(0) rotate(var(--r))}to{transform:translateY(calc(var(--u)*2.4)) rotate(calc(var(--r) + 60deg))}}
  .bgrid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:calc(var(--u)*1.2) calc(var(--u)*2);margin-top:calc(var(--u)*3);max-width:calc(var(--u)*84)}
  .bc{backdrop-filter:blur(8px);display:flex;align-items:center;gap:calc(var(--u)*1.8);padding:calc(var(--u)*1.4) calc(var(--u)*1.8);border-radius:calc(var(--u)*1.2);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
  .bc .bd{flex:none;width:calc(var(--u)*8.4);border-radius:calc(var(--u)*.8);overflow:hidden;text-align:center;box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.4) rgba(0,0,0,.25)}
  .bc .bd b{display:block;background:var(--gold);color:var(--navy);font:800 calc(var(--u)*1.05)/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:calc(var(--u)*.7) 0}
  .bc .bd span{display:block;background:#fff;color:var(--red);font:700 calc(var(--u)*3.6)/1 var(--serif);padding:calc(var(--u)*.7) 0 calc(var(--u)*.9)}
  .bc .bn{font:700 calc(var(--u)*2.7)/1.1 var(--serif);min-width:0}
  .bc .bw{display:block;margin-top:calc(var(--u)*.5);font:600 calc(var(--u)*1.3)/1 var(--sans);letter-spacing:.06em;color:var(--gold)}
  .bc.today{background:var(--gold);color:var(--navy);border-color:var(--gold)}
  .bc.today .bw{color:var(--red)}
  .bc.today .bd b{background:var(--navy);color:var(--gold)}
  .s-bday .body{margin-top:calc(var(--u)*2.6);font-style:italic;font-family:var(--serif)}
  .s-bday.many .bc .bn{font-size:calc(var(--u)*2.1)}
  .s-bday.many .bc .bd{width:calc(var(--u)*7)}
  .s-bday.many .bc .bd span{font-size:calc(var(--u)*2.8)}

  /* scripture */
  .s-scripture{background:radial-gradient(110% 90% at 80% 100%, #3A1420 0%, var(--navy) 55%, #0C1528 100%);color:var(--cream)}
  .s-scripture .pad{align-items:center;text-align:center}
  .quote-mark{font:700 calc(var(--u)*12)/.6 var(--serif);color:var(--gold);height:calc(var(--u)*5)}
  .verse{font:italic 500 calc(var(--u)*4.2)/1.3 var(--serif);max-width:calc(var(--u)*76);text-wrap:balance}
  .cite{margin-top:calc(var(--u)*2.6);font:800 calc(var(--u)*1.5)/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}

  .s-video{background:#000}
  .s-video video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  /* brand bug, bottom left of text slides */
  .bug{position:absolute;left:calc(var(--u)*7);bottom:calc(var(--u)*3.4);display:flex;align-items:center;gap:calc(var(--u)*1.2);font:800 calc(var(--u)*1.05)/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase;opacity:.75}
  .bug img{height:calc(var(--u)*3.6);width:auto}
  .bug small{display:block;font-weight:600;letter-spacing:.06em;text-transform:none;opacity:.8;font-size:calc(var(--u)*1.05)}

  /* progress line */
  #progress{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*.35);z-index:5;background:rgba(255,255,255,.08)}
  #progress i{display:block;height:100%;width:0;background:var(--gold)}

  /* ============ COUNTDOWN ============ */
  #cd{position:absolute;right:calc(var(--u)*2.6);top:calc(var(--u)*2.6);z-index:6;display:flex;align-items:stretch;border-radius:calc(var(--u)*1.1);overflow:hidden;box-shadow:0 calc(var(--u)*.6) calc(var(--u)*2.2) rgba(0,0,0,.35);opacity:0;transform:translateY(calc(var(--u)*-1));transition:opacity .8s, transform .8s}
  #cd.on{opacity:1;transform:none}
  #cd .l{background:var(--navy);color:var(--cream);padding:calc(var(--u)*1) calc(var(--u)*1.6);display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*.45)}
  #cd .l small{font:800 calc(var(--u)*.95)/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  #cd .l b{font:700 calc(var(--u)*1.75)/1 var(--serif);white-space:nowrap}
  #cd .r{background:var(--red);color:#fff;display:flex;align-items:center;padding:0 calc(var(--u)*1.6);font:800 calc(var(--u)*2.6)/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.02em}

  #take{position:absolute;inset:0;z-index:8;opacity:0;pointer-events:none;transition:opacity 1.2s;background:radial-gradient(110% 90% at 80% 0%, var(--navy2) 0%, var(--navy) 60%, #0C1528 100%);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #take.on{opacity:1}
  #take .rings{opacity:.5}
  #take .rings.l{left:calc(var(--u)*-14);right:auto;top:auto;bottom:calc(var(--u)*-18)}
  #take img{height:calc(var(--u)*8);width:auto;margin-bottom:calc(var(--u)*2.6)}
  #take .k{font:800 calc(var(--u)*1.6)/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
  #take .n{margin-top:calc(var(--u)*1.4);font:700 calc(var(--u)*4.6)/1.05 var(--serif)}
  #take .clock{margin-top:calc(var(--u)*2.2);font:700 calc(var(--u)*17)/1 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:#fff}
  #take .clock.now{font-size:calc(var(--u)*9);color:var(--gold)}
  #take .line{margin-top:calc(var(--u)*2.6);font:500 calc(var(--u)*2)/1.4 var(--sans);opacity:.85;max-width:calc(var(--u)*64)}

  /* operator help, shows briefly when a key is pressed */
  #help{position:absolute;left:50%;bottom:calc(var(--u)*2.2);transform:translateX(-50%);z-index:9;background:rgba(12,21,40,.92);color:var(--cream);font:600 calc(var(--u)*1.15)/1 var(--sans);padding:calc(var(--u)*1) calc(var(--u)*1.8);border-radius:99px;opacity:0;transition:opacity .4s;white-space:nowrap}
  #help.on{opacity:1}
  #help b{color:var(--gold)}
</style>
</head>
<body>
<div id="frame">
  <div id="stage"></div>
  <div id="cd"><div class="l"><small>Begins in</small><b></b></div><div class="r">--:--</div></div>
  <div id="take">
    <div class="rings"></div><div class="rings l"></div>
    <img alt="" id="takeLogo">
    <div class="k">Begins in</div>
    <div class="n"></div>
    <div class="clock">0:00</div>
    <div class="line"></div>
  </div>
  <div id="progress"><i></i></div>
  <div id="help"></div>
</div>

<script src="config.js"></script>
<script>
(function(){
  const C = window.ANNOUNCE;
  const Q = new URLSearchParams(location.search);
  const stage = document.getElementById("stage");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  /* ---------- time (add ?at=2026-10-18T10:52 to preview another moment) ---------- */
  const offset = Q.get("at") ? (new Date(Q.get("at")) - new Date()) : 0;
  const now = () => new Date(Date.now() + offset);
  const DAYS = ["sun","mon","tue","wed","thu","fri","sat"];
  function parseTime(t){
    if (!t) return null;
    const m = String(t).trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i);
    if (!m) return null;
    let h = +m[1]; const mi = +(m[2] || 0); const ap = (m[3] || "").toLowerCase();
    if (ap === "pm" && h < 12) h += 12; if (ap === "am" && h === 12) h = 0;
    return h * 60 + mi;
  }
  function dayList(s){
    s = String(s || "").toLowerCase();
    if (s.includes("daily")) return [0,1,2,3,4,5,6];
    if (s.includes("weekday")) return [1,2,3,4,5];
    if (s.includes("weekend")) return [0,6];
    return s.split(/[,\s/&]+/).map(x => DAYS.indexOf(x.slice(0,3))).filter(i => i >= 0);
  }
  const ymd = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const parseDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const fmtTime = mins => { let h = Math.floor(mins/60), m = mins % 60; const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + (m ? ":" + String(m).padStart(2,"0") : "") + " " + ap; };

  function visible(s){
    if ((s.type || "").toLowerCase() === "birthdays" && !birthdaysNow().length) return false;
    const today = ymd(now());
    if (s.start && today < s.start) return false;
    if (s.end && today > s.end) return false;
    return true;
  }

  /* ---------- slide builders ---------- */
  const ICON = {
    time: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    place:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    date: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>'
  };
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  function tile(date){
    const d = parseDate(date);
    return `<div class="datetile"><div class="m">${MON[d.getMonth()]} · ${WD[d.getDay()].slice(0,3)}</div><div class="d">${d.getDate()}</div></div>`;
  }
  function metaLine(s, withDate){
    const bits = [];
    if (withDate && s.date) { const d = parseDate(s.date); bits.push(`<span>${ICON.date}${WD[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}</span>`); }
    if (s.time) bits.push(`<span>${ICON.time}${esc(s.time)}</span>`);
    if (s.place) bits.push(`<span>${ICON.place}${esc(s.place)}</span>`);
    return bits.length ? `<div class="meta">${bits.join("")}</div>` : "";
  }
  const logo = C.logo ? `<img src="${esc(C.logo)}" alt="">` : "";
  const bug = `<div class="bug">${logo}<div>${esc(C.corpsName)}<small>${esc(C.orgLine)}</small></div></div>`;

  function build(s){
    const el = document.createElement("div");
    const type = (s.type || "announcement").toLowerCase();
    if (type === "announcement" || type === "text" || type === "event") {
      const theme = s.media ? "has-bg" : "t-" + (s.theme || "cream");
      const rows = s.rows ? `<ul class="rows">${s.rows.map(r => `<li><span class="w">${esc(r.when)}</span><span class="x">${esc(r.what)}</span></li>`).join("")}</ul>` : "";
      const text = `${s.kicker ? `<div class="kicker">${esc(s.kicker)}</div>` : ""}<div class="title">${esc(s.title)}</div>${metaLine(s, false)}${rows}${s.body ? `<div class="body">${esc(s.body)}</div>` : ""}`;
      el.className = "slide " + theme;
      el.innerHTML = (s.media ? `<img class="bgimg" src="${esc(s.media)}" alt=""><div class="bgshade"></div>` : `<div class="rings"></div>`) +
        `<div class="pad">${s.date ? `<div class="ev">${tile(s.date)}<div>${text}</div></div>` : text}</div>` + bug;
    }
    else if (type === "flyer" || type === "image") {
      const side = !!(s.title || s.body);
      el.className = "slide s-flyer" + (side ? " side" : "");
      el.innerHTML = `<img class="blur" src="${esc(s.media)}" alt=""><img class="fl" src="${esc(s.media)}" alt="${esc(s.title || "")}">` +
        (side ? `<div class="fd">${s.date ? tile(s.date) : ""}${s.kicker ? `<div class="kicker">${esc(s.kicker)}</div>` : ""}<div class="title">${esc(s.title)}</div>${metaLine(s, false)}${s.body ? `<div class="body">${esc(s.body)}</div>` : ""}</div>` : "");
    }
    else if (type === "week") {
      const today = now().getDay();
      const items = (C.week || []).map(w => {
        const ds = dayList(w.days); const s0 = parseTime(w.start), e0 = parseTime(w.end);
        const label = w.days.replace(/\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\b/g, x => x);
        return `<div class="wi${ds.includes(today) ? " today" : ""}"><span class="dd">${esc(label)}</span><span class="nm">${esc(w.name)}</span><span class="tm">${s0 != null ? fmtTime(s0) : ""}${e0 != null ? " to " + fmtTime(e0) : ""}</span></div>`;
      }).join("");
      el.className = "slide s-week t-cream";
      el.innerHTML = `<div class="pad"><div class="kicker">${esc(s.kicker || "Every Week")}</div><div class="title">${esc(s.title || "This Week at Harlem Temple")}</div><div class="wgrid">${items}</div></div>`;
    }
    else if (type === "birthdays") {
      const ppl = birthdaysNow();
      const t = ymd(now());
      el.className = "slide s-bday" + (ppl.length > 6 ? " many" : "");
      const cols = ppl.length <= 2 ? ppl.length || 1 : ppl.length <= 6 ? 2 : 3;
      const colors = ["var(--gold)", "#fff", "var(--cream)", "#F7C95A"];
      let conf = ""; for (let i = 0; i < 26; i++) conf += `<i style="left:${(i*37)%100}%;top:${(i*53)%60}%;background:${colors[i%4]};--r:${(i*47)%180}deg;animation-delay:-${i%9}s"></i>`;
      el.innerHTML = `<div class="rings"></div><div class="confetti">${conf}</div><div class="pad"><div class="kicker">${esc(s.kicker || "Happy Birthday")}</div><div class="title">${esc(s.title || "Celebrating You This Week")}</div>` +
        `<div class="bgrid" style="--cols:${cols}">${ppl.map(p => { const d = parseDate(p.date);
          return `<div class="bc${p.date === t ? " today" : ""}"><div class="bd"><b>${MON[d.getMonth()]}</b><span>${d.getDate()}</span></div><div class="bn">${esc(p.name)}<span class="bw">${p.date === t ? "Today!" : WD[d.getDay()]}</span></div></div>`; }).join("")}</div>` +
        `${s.body ? `<div class="body">${esc(s.body)}</div>` : ""}</div>` + bug;
    }
    else if (type === "scripture") {
      el.className = "slide s-scripture";
      el.innerHTML = `<div class="pad"><div class="quote-mark">&ldquo;</div><div class="verse">${esc(s.text)}</div><div class="cite">${esc(s.cite)}</div></div>`;
    }
    else if (type === "video") {
      el.className = "slide s-video";
      el.innerHTML = `<video src="${esc(s.media)}" muted playsinline preload="auto"></video>`;
    }
    return el;
  }

  /* ---------- birthdays (read from the data branch, updated every Sunday) ---------- */
  let BDAY = null;
  function birthdaysNow(){
    if (!BDAY || !BDAY.people) return [];
    const t = ymd(now());
    if (BDAY.to && t > BDAY.to) return [];          // week is over, hide until the next update
    return BDAY.people.filter(p => p.date && p.name).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.name.localeCompare(b.name));
  }
  async function loadBirthdays(){
    const url = (C.birthdays && C.birthdays.feed) || "";
    if (!url) return;
    try { const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" }); if (r.ok) BDAY = await r.json(); } catch(e) { /* offline: keep what we have */ }
  }

  /* ---------- slideshow ---------- */
  let list = [], idx = -1, timer = null, paused = false, cur = null;
  const bar = document.querySelector("#progress i");
  function refreshList(){ list = (C.slides || []).filter(visible); }
  function show(i){
    refreshList();
    if (!list.length) return;
    idx = (i + list.length) % list.length;
    const s = list[idx];
    const el = build(s);
    stage.appendChild(el);
    const old = cur; cur = el;
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("on")));
    if (old) { old.classList.remove("on"); setTimeout(() => old.remove(), 1300); }
    clearTimeout(timer);
    const secs = s.duration || C.secondsPerSlide || 12;
    const v = el.querySelector("video");
    bar.style.transition = "none"; bar.style.width = "0";
    if (v) {
      v.play().catch(() => {});
      v.onended = () => !paused && show(idx + 1);
      v.onerror = () => !paused && show(idx + 1);
    } else if (!paused) {
      requestAnimationFrame(() => { bar.style.transition = `width ${secs}s linear`; bar.style.width = "100%"; });
      timer = setTimeout(() => show(idx + 1), secs * 1000);
    }
  }

  /* ---------- service countdown ---------- */
  const cd = document.getElementById("cd"), take = document.getElementById("take");
  if (C.logo) document.getElementById("takeLogo").src = C.logo; else document.getElementById("takeLogo").remove();
  const cdOff = Q.get("countdown") === "off";
  function occurrences(){
    // each service as real start/end times for yesterday, today and the next 7 days
    const out = [], base = now(); base.setHours(0,0,0,0);
    for (let k = -1; k <= 7; k++) {
      const d = new Date(base); d.setDate(d.getDate() + k);
      const all = (C.services || []).filter(s => dayList(s.day || s.days).includes(d.getDay()))
        .concat((C.specialServices || []).filter(s => s.date === ymd(d)));
      for (const s of all) {
        const st = parseTime(s.start); if (st == null) continue;
        let en = parseTime(s.end); if (en == null) en = st + 60;
        const a = new Date(d); a.setMinutes(st); const b = new Date(d); b.setMinutes(en);
        out.push({ s, a, b });
      }
    }
    return out.sort((x, y) => x.a - y.a);
  }
  const fmtLeft = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t % 60;
    return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0"); };
  let forceTake = false;
  function tick(){
    if (cdOff) return;
    const t = now(), occ = occurrences();
    const running = occ.find(o => t >= o.a && t < o.b);
    const next = occ.find(o => o.a > t);
    // corner countdown: next service within its window, and nothing else running (a running service hides it)
    let corner = null;
    if (next && !running) {
      const left = next.a - t;
      if (left <= (next.s.showWithinMinutes ?? 60) * 60e3) corner = { o: next, left };
    }
    // also allow the corner during a running service if the next one is close (e.g. Sunday School then Holiness)
    if (next && running && running.s !== next.s && (next.a - t) <= (next.s.showWithinMinutes ?? 60) * 60e3 && (running.b - next.a) <= 0) corner = { o: next, left: next.a - t };
    if (corner) {
      cd.querySelector("b").textContent = corner.o.s.name;
      cd.querySelector(".r").textContent = fmtLeft(corner.left);
      cd.classList.add("on");
    } else cd.classList.remove("on");

    // full screen takeover in the final minutes, holds "Starting now" for 1 minute
    let tk = null;
    if (next && next.s.takeoverMinutes && (next.a - t) <= next.s.takeoverMinutes * 60e3) tk = { o: next, left: next.a - t };
    const just = occ.find(o => o.s.takeoverMinutes && t >= o.a && t - o.a < 60e3);
    if (!tk && just) tk = { o: just, left: 0 };
    if (forceTake && !tk && next) tk = { o: next, left: next.a - t };
    if (tk) {
      take.querySelector(".n").textContent = tk.o.s.name;
      const clock = take.querySelector(".clock");
      if (tk.left > 0) { clock.textContent = fmtLeft(tk.left); clock.classList.remove("now"); take.querySelector(".k").style.visibility = ""; }
      else { clock.textContent = "Starting now"; clock.classList.add("now"); take.querySelector(".k").style.visibility = "hidden"; }
      take.querySelector(".line").textContent = tk.o.s.takeoverLine || "";
      take.classList.add("on"); cd.classList.remove("on");
    } else take.classList.remove("on");
  }

  /* ---------- operator keys (sanctuary laptop / clicker) ---------- */
  const help = document.getElementById("help"); let helpT;
  function flash(msg){ help.innerHTML = msg; help.classList.add("on"); clearTimeout(helpT); helpT = setTimeout(() => help.classList.remove("on"), 2600); }
  document.addEventListener("keydown", e => {
    const k = e.key;
    if (["ArrowRight","PageDown","ArrowDown"].includes(k)) { show(idx + 1); }
    else if (["ArrowLeft","PageUp","ArrowUp"].includes(k)) { show(idx - 1); }
    else if (k === " ") { paused = !paused; flash(paused ? "<b>Paused</b> · Space to resume" : "<b>Playing</b>"); show(idx); e.preventDefault(); }
    else if (k === "c" || k === "C") { forceTake = !forceTake; tick(); flash(forceTake ? "<b>Countdown on</b> · C to hide" : "<b>Countdown off</b>"); }
    else if (k === "f" || k === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
    else if (k === "?" || k === "h" || k === "H") flash("<b>→</b> next &nbsp; <b>←</b> back &nbsp; <b>Space</b> pause &nbsp; <b>C</b> countdown &nbsp; <b>F</b> full screen");
  });
  let idleT; const wake = () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 2500); };
  document.addEventListener("mousemove", wake); wake();

  /* ---------- auto-update: reload when a new version is published ---------- */
  async function fingerprint(){
    let s = "";
    for (const f of ["index.html", "config.js"]) {
      const r = await fetch(f, { method: "HEAD", cache: "no-store" });
      if (!r.ok) throw new Error(f);
      s += r.headers.get("etag") || r.headers.get("last-modified") || await (await fetch(f, { cache: "no-store" })).text();
    }
    let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h;
  }
  if (location.protocol.startsWith("http") && !Q.has("at")) {
    let running = null; fingerprint().then(f => running = f).catch(() => {});
    setInterval(async () => { try { const f = await fingerprint(); if (running === null) running = f; else if (f !== running && !take.classList.contains("on")) location.reload(); } catch(e){} }, 5 * 60e3);
  }

  // ?slide=3 jumps to a slide, ?pause holds it (handy for previews)
  if (Q.has("pause")) paused = true;
  loadBirthdays().finally(() => show(Q.get("slide") ? +Q.get("slide") - 1 : 0));
  setInterval(loadBirthdays, 30 * 60e3);
  tick(); setInterval(tick, 250);
})();
</script>
</body>
